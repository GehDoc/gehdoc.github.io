<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GehDoc</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #7dd3fc;
        --border: rgba(255,255,255,0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        padding: 32px;
      }

      .container {
        width: min(760px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 32px 28px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      }

      .label {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 24px 0 32px;
      }

      a {
        color: var(--text);
        text-decoration: none;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        padding: 10px 14px;
        border-radius: 10px;
      }

      a:hover {
        border-color: rgba(125, 211, 252, 0.6);
      }

      .project {
        border-top: 1px solid var(--border);
        padding-top: 24px;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .repo-link {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <p class="label">GitHub Pages</p>
      <h1>GehDoc</h1>

      <div class="links">
        <a href="https://github.com/gehdoc">GitHub profile</a>
        <a href="https://github.com/gehdoc/svg-to-video">SVG to Video repository</a>
        <a href="https://gehdoc.github.io/svg-to-video/">SVG to Video project page</a>
      </div>

      <section class="project">
        <h2>Featured project</h2>
        <p>SVG to Video</p>
        <p class="repo-link">
          <a href="https://github.com/gehdoc/svg-to-video">Repository</a>
        </p>
      </section>
    </main>
  </body>
</html>
